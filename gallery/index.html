<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reliq · Skarbiec artefaktów</title>
<link rel="icon" href="../assets/icons/favicon-64.png">
<link rel="stylesheet" href="../css/fonts.css">
<style>
/* Every tomb artifact of the game, tier by tier, turning in lit niches: a vault of dark
   walnut, the journal's brass and parchment for the type. One look, dark by design. */
:root {
  color-scheme: dark;
  --wood: #1d140e;
  --niche: #2a1d14;
  --parchment: #ead9b4;
  --sepia: #b9a27c;
  --brass: #c9a35a;
  --display: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
  --label: 'Cinzel', Georgia, serif;
  --body: 'EB Garamond', Garamond, Georgia, serif;
}
* { box-sizing: border-box; }
html { background: var(--wood); }
body {
  margin: 0;
  background: radial-gradient(120% 60% at 50% 0%, #2b1c12 0%, var(--wood) 70%) var(--wood);
  color: var(--parchment);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: max(32px, env(safe-area-inset-top, 0px)) max(56px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 44px;
}
nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--label); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
nav a, nav button { color: var(--brass); text-decoration: none; background: none; border: 1px solid color-mix(in srgb, var(--brass) 40%, transparent); border-radius: 3px; padding: 6px 12px; font: inherit; letter-spacing: inherit; cursor: pointer; }
nav a:hover, nav button:hover { color: var(--parchment); border-color: var(--brass); }
nav a:focus-visible, nav button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
header { display: grid; gap: 10px; justify-items: center; text-align: center; }
.eyebrow { font-family: var(--label); letter-spacing: 0.32em; font-size: 12px; color: var(--brass); text-transform: uppercase; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(30px, 6vw, 48px); letter-spacing: 0.04em; text-wrap: balance; }
header p { margin: 0; max-width: 56ch; color: var(--sepia); font-style: italic; }
.rule { width: min(360px, 70%); height: 1px; background: linear-gradient(90deg, transparent, var(--brass), transparent); opacity: 0.6; }
main { display: grid; gap: 44px; }
section.tier { display: grid; gap: 16px; }
.tier-head { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; border-bottom: 1px solid color-mix(in srgb, var(--brass) 35%, transparent); padding-bottom: 8px; }
.tier-head h2 { margin: 0; font-family: var(--label); font-weight: 700; font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--tier); }
.tier-head .meta { font-family: var(--label); font-size: 12px; letter-spacing: 0.1em; color: var(--sepia); font-variant-numeric: tabular-nums; }
.shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .shelf { grid-template-columns: minmax(0, 1fr); } }
.card { display: grid; grid-template-rows: auto 1fr; background: var(--niche); border: 1px solid color-mix(in srgb, var(--brass) 22%, transparent); border-radius: 3px; overflow: hidden; min-width: 0; }
.stage { aspect-ratio: 1; max-width: 100%; background: radial-gradient(closest-side, color-mix(in srgb, var(--tier) 30%, #3a2818) 0%, #23180f 70%, #1a120b 100%); cursor: grab; touch-action: pan-y; }
.stage:active { cursor: grabbing; }
.stage:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
.stage canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.info { display: grid; gap: 6px; padding: 14px 16px 16px; align-content: start; min-width: 0; }
.info h3 { margin: 0; font-family: var(--label); font-weight: 500; font-size: 16px; letter-spacing: 0.06em; line-height: 1.25; text-wrap: balance; }
.info .lore { margin: 0; color: var(--sepia); font-size: 15px; }
.info .detail { margin: 0; opacity: 0.8; font-size: 14px; font-style: italic; }
.info .stats { font-family: var(--label); font-size: 11px; letter-spacing: 0.1em; color: var(--sepia); opacity: 0.75; font-variant-numeric: tabular-nums; }
footer { text-align: center; color: var(--sepia); font-size: 14px; font-style: italic; opacity: 0.8; }
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="../" id="play"></a><button type="button" id="lang"></button></nav>
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="heading"></h1>
    <div class="rule"></div>
    <p id="intro"></p>
  </header>
  <main id="tiers"></main>
  <footer id="footer"></footer>
</div>
<script type="module" src="gallery.js"></script>
</body>
</html>
